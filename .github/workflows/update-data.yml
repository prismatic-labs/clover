name: Update mental health stressor data

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

# contents:write is used ONLY to push the unprotected `data` branch.
# `main` stays protected by the protect-main ruleset; nothing here writes to it.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site code (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Checkout data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          ref: data
          path: .data-branch

      - name: Overlay data branch onto working tree
        run: |
          test -d .data-branch/data || { echo "::error::data branch has no data/ directory"; exit 1; }
          rm -rf data
          cp -R .data-branch/data data

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: pip install --no-deps -r scripts/requirements.txt

      - name: Fetch stressor data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/fetch-data.py

      - name: Regenerate history summary
        run: python3 scripts/gen-history-summary.py

      - name: Commit data to the data branch
        run: |
          rm -rf .data-branch/data
          cp -R data .data-branch/data
          cd .data-branch
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: weekly update"
          git push origin HEAD:data

      - name: Drop data-branch checkout before packaging the site
        run: rm -rf .data-branch

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
